name: spark-rapids-jni

on:
  workflow_dispatch:
    inputs:
      cudf_repository: &cudf_repository
        description: 'cuDF repository'
        type: string
        required: false
        default: 'NVIDIA/cudf'
      cudf_commit: &cudf_commit
        description: 'cuDF commit SHA or branch'
        type: string
        required: false
        default: 'release/26.08'
      spark_rapids_jni_repository: &spark_rapids_jni_repository
        description: 'spark-rapids-jni repository'
        type: string
        required: false
        default: 'NVIDIA/spark-rapids-jni'
      spark_rapids_jni_commit: &spark_rapids_jni_commit
        description: 'spark-rapids-jni commit SHA or branch'
        type: string
        required: false
        default: 'release/26.08'
  workflow_call:
    inputs:
      cudf_repository: *cudf_repository
      cudf_commit: *cudf_commit
      spark_rapids_jni_repository: *spark_rapids_jni_repository
      spark_rapids_jni_commit: *spark_rapids_jni_commit

jobs:
  spark-rapids-jni-build:
    runs-on: linux-amd64-cpu8
    container:
      image: rapidsai/ci-spark-rapids-jni:rockylinux8-cuda12.9.1
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          repository: ${{ inputs.spark_rapids_jni_repository }}
          submodules: recursive
          ref: ${{ inputs.spark_rapids_jni_commit }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          repository: ${{ inputs.cudf_repository }}
          ref: ${{ inputs.cudf_commit }}
          path: thirdparty/cudf
      - name: Install gha-tools
        run: |
          dnf -y install jq
          wget https://github.com/rapidsai/gha-tools/releases/latest/download/tools.tar.gz -O - | tar -xz -C /usr/local/bin
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 43200 # 12h
      - name: Setup sccache-dist
        uses: rapidsai/shared-actions/setup-sccache-dist@main
        env:
          AWS_REGION: "${{ env.AWS_REGION }}"
          AWS_ACCESS_KEY_ID: "${{ env.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ env.AWS_SECRET_ACCESS_KEY }}"
      - name: "Build spark-rapids-jni"
        env:
          SCCACHE_S3_KEY_PREFIX: spark-rapids-jni
          SCCACHE_S3_PREPROCESSOR_CACHE_KEY_PREFIX: spark-rapids-jni/preprocessor
          SCCACHE_S3_USE_PREPROCESSOR_CACHE_MODE: true
        run: |
          set -euo pipefail

          rapids-install-sccache
          rapids-configure-sccache

          export CPP_PARALLEL_LEVEL="$PARALLEL_LEVEL"

          # Don't use the build cluster for CMake's compiler tests
          echo -e '\nset(ENV{SCCACHE_NO_DIST_COMPILE} "1")' >> thirdparty/cudf-pins/add_dependency_pins.cmake

          mkdir target
          source build/env.sh && CMAKE_CUDA_ARCHITECTURES=75 LIBCUDF_DEPENDENCY_MODE=latest USE_GDS=on ${sclCMD} build/buildcpp.sh

          sccache --show-stats
